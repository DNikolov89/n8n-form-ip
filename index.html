<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Форма</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #f5f5f7;
      color: #1d1d1f;
    }
    .card {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 28px; color: #6e6e73; }
    .field { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      font-size: 14px;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d2d2d7;
      border-radius: 10px;
      background: #fff;
      font: inherit;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #0071e3;
      box-shadow: 0 0 0 3px rgba(0,113,227,.12);
    }
    button {
      width: 100%;
      margin-top: 6px;
      padding: 13px 16px;
      border: 0;
      border-radius: 10px;
      background: #0071e3;
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    #status {
      margin: 16px 0 0;
      min-height: 20px;
      text-align: center;
      font-size: 14px;
    }
    .success { color: #188038; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Форма</h1>
    <p class="subtitle">Моля, попълнете данните по-долу.</p>

    <form id="dataForm">
      <div class="field">
        <label for="name">Име</label>
        <input id="name" name="Name" type="text" required autocomplete="name">
      </div>

      <div class="field">
        <label for="gender">Пол</label>
        <select id="gender" name="Gender" required>
          <option value="" selected disabled>Изберете</option>
          <option value="Male">Мъж</option>
          <option value="Female">Жена</option>
          <option value="Other">Друго</option>
        </select>
      </div>

      <div class="field">
        <label for="age">Възраст</label>
        <input id="age" name="Age" type="number" min="0" max="120" step="1" required>
      </div>

      <div class="field">
        <label for="country">Държава на пребиваване</label>
        <input id="country" name="Country of residence" type="text" required autocomplete="country-name">
      </div>

      <button id="submitButton" type="submit">Изпрати</button>
      <p id="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const WEBHOOK_URL =
      "https://enterprise.encorp.ai/webhook/eaea0652-df80-4cf9-92ba-68051b53821b";

    const form = document.getElementById("dataForm");
    const status = document.getElementById("status");
    const submitButton = document.getElementById("submitButton");

    function localIsoTimestamp() {
      const now = new Date();
      const pad = (n, size = 2) => String(n).padStart(size, "0");

      const offsetMinutes = -now.getTimezoneOffset();
      const sign = offsetMinutes >= 0 ? "+" : "-";
      const offsetHours = pad(Math.floor(Math.abs(offsetMinutes) / 60));
      const offsetMins = pad(Math.abs(offsetMinutes) % 60);

      return (
        `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}` +
        `T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}.` +
        `${pad(now.getMilliseconds(), 3)}${sign}${offsetHours}:${offsetMins}`
      );
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      status.textContent = "Изпращане...";
      status.className = "";
      submitButton.disabled = true;

      const payload = {
        "Name": document.getElementById("name").value.trim(),
        "Gender": document.getElementById("gender").value,
        "Age": Number(document.getElementById("age").value),
        "Country of residence": document.getElementById("country").value.trim(),
        "submittedAt": localIsoTimestamp(),
        "formMode": "test"
      };

      try {
        const response = await fetch(WEBHOOK_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        status.textContent = "Данните бяха изпратени успешно.";
        status.className = "success";
        form.reset();
      } catch (error) {
        console.error(error);
        status.textContent =
          "Възникна грешка при изпращането. Моля, опитайте отново.";
        status.className = "error";
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
